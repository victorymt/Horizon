name: Daily Horizon Summary

on:
  schedule:
    # 16:17 UTC is 00:17 the next day in UTC+8. Two retries follow within the
    # same UTC+8 calendar day (20:17 UTC = 04:17, 00:17 UTC = 08:17) so a
    # dropped run still publishes the same report date.
    - cron: '17 16,20,0 * * *'
  workflow_dispatch:      # Allow manual trigger

concurrency:
  group: horizon-daily-publication
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check today's publication
        id: publication
        run: |
          # Report date is the UTC+8 calendar day, not the UTC day: the 16:17 UTC
          # trigger is 00:17 (+08) of the following date.
          DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "HORIZON_REPORT_DATE=$DATE" >> "$GITHUB_ENV"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages --depth=1
          if git cat-file -e "origin/gh-pages:_posts/$DATE-summary-en.md" && git cat-file -e "origin/gh-pages:_posts/$DATE-summary-zh.md"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.publication.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.publication.outputs.needed == 'true'
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        if: steps.publication.outputs.needed == 'true'
        run: uv sync --locked

      - name: Prepare GitHub Actions config
        if: steps.publication.outputs.needed == 'true'
        run: cp data/config.github.json data/config.json

      # Startup validation runs before scraping; a nonzero exit blocks deployment.
      # No --hours here on purpose: a rolling lookback would ignore the report
      # date. Without it the window is the UTC+8 calendar day derived from
      # HORIZON_REPORT_DATE above.
      - name: Run Horizon
        if: steps.publication.outputs.needed == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run horizon

      - name: Preserve raw input and generated summaries
        if: always() && steps.publication.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: horizon-${{ env.DATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/raw/*.json
            data/summaries/*.md
            docs/_posts/*.md
          retention-days: 90
          if-no-files-found: warn

      - name: Require both language outputs
        if: steps.publication.outputs.needed == 'true'
        run: |
          test -s "docs/_posts/$DATE-summary-en.md"
          test -s "docs/_posts/$DATE-summary-zh.md"

      - name: Deploy to GitHub Pages
        if: steps.publication.outputs.needed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
